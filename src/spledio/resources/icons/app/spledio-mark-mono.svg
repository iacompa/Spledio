<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
  <title>App mark</title>
  <!-- Single-colour glyph of the app motif (no tile). Every edge sits on the
       24-unit pixel grid. Colour comes from the surrounding text colour. -->
  <!-- upper harmonic -->
  <rect x="3" y="3" width="12" height="2" rx="1"/>
  <!-- resonance band, full outside the selection, reduced inside it -->
  <rect x="2" y="11" width="4" height="2" rx="1"/>
  <rect x="18" y="11" width="4" height="2" rx="1"/>
  <rect x="9" y="11" width="6" height="2" rx="1" opacity="0.4"/>
  <!-- selection -->
  <path fill-rule="evenodd" d="M8.5 8H15.5A1.5 1.5 0 0 1 17 9.5V14.5A1.5 1.5 0 0 1 15.5 16H8.5A1.5 1.5 0 0 1 7 14.5V9.5A1.5 1.5 0 0 1 8.5 8ZM8.5 9A0.5 0.5 0 0 0 8 9.5V14.5A0.5 0.5 0 0 0 8.5 15H15.5A0.5 0.5 0 0 0 16 14.5V9.5A0.5 0.5 0 0 0 15.5 9Z"/>
  <!-- fundamental -->
  <rect x="3" y="18" width="18" height="3" rx="1.5"/>
</svg>
